[package]
name = "pipin"
version = "0.1.0"
edition = "2021"

[dependencies]
bpaf = { version = "0.9.20", default-features = false, features = ["autocomplete", "derive"] }
gpio-cdev = { version = "0.6.0", default-features = false }
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.48.0", default-features = false, features = ["fs", "macros", "rt", "rt-multi-thread"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
