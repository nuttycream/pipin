[package]
name = "pipin"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "3"
members = ["pipin-core", "pipin-d","pipin-tui","pipin-web"]

[dependencies]
gpio-cdev = { version = "0.6.0", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
